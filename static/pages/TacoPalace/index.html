<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taco Palace</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body id="body">
    <header class="barra-nav">
        <div class="l1">
            <h1 class="TacoPalace">
                <img src="static/images/Imágenes/logo.png" alt="logo" class="logo"><span class="taco">Taco</span>Palace
            </h1>
        </div>
        <div class="l2">
            <div class="busqueda">
                <input type="text" id="barra-busqueda" name="email" placeholder="Email">
                <button class="login">Login</button>
            </div>
            <div class="compras">
                <img src="static/images/Imágenes/carrito.png" alt="Carrito de compra" class="carrito">
                <p class="n-compra">0</p>
            </div>
        </div>
    </header>
    <main class="c-principal">
        <div class="c-catalogo">
            <div class="t-catalogo">
                <img src="static/images/Imágenes/enchiladas.jpg" alt="Enchiladas" class="comida-mexicana">
                <p class="catalogo">Enchiladas</p>
            </div>
            <div class="t-catalogo">
                <img src="static/images/Imágenes/tacos.jpg" alt="Tacos" class="comida-mexicana">
                <p class="catalogo">Tacos</p>
            </div>
            <div class="t-catalogo">
                <img src="static/images/Imágenes/flautas.jpg" alt="Flautas" class="comida-mexicana">
                <p class="catalogo">Flautas</p>
            </div>
            <div class="t-catalogo">
                <img src="static/images/Imágenes/gorditas.jpg" alt="Gorditas" class="comida-mexicana">
                <p class="catalogo">Gorditas</p>
            </div>
            <div class="t-catalogo">
                <img src="static/images/Imágenes/tostadas.jpg" alt="Tostadas" class="comida-mexicana">
                <p class="catalogo">Tostadas</p>
            </div>
            <div class="t-catalogo">
                <img src="static/images/Imágenes/enfrijoladas.jpg" alt="Enfrijoladas" class="comida-mexicana">
                <p class="catalogo">Enfrijoladas</p>
            </div>
        </div>

        <div class="c-presentacion">
            <div class="c-banner">
                <div class="info">
                    <p class="invitacion">
                        La mejor variedad en platillos de comida
                        <span class="negrita">mexicana</span>
                    </p>
                    <p class="contacto">
                        Contamos con<span class="subrayado"> servicio </span>a <span class="destacado">domicilio</span>
                    </p>
                </div>
                <img src="static/images/Imágenes/comida-mexicana.jpg" alt="Comida mexicana" class="img">
            </div>
            <div class="c-recomendados">
                <p class="recomendados">Recomendados:</p>
                <img src="static/images/Imágenes/orden-tacos.jpg" alt="Tacos" class="img-orden">
                <div class="t">
                        <div class="col-1">
                            <p class="orden">Orden de Tacos</p>
                            <a href="#" class="ver-mas">Ver Más...</a>
                        </div>
                        <div class="col-2">
                            <button class="mas" id="boton1">+</button>
                        </div>
                </div>
                <img src="static/images/Imágenes/orden-flautas.jpg" alt="Flautas" class="img-orden">
                <div class="t">
                        <div class="col-1">
                            <p class="orden">Orden de Flautas</p>
                            <a href="#" class="ver-mas">Ver Más...</a>
                        </div>
                        <div class="col-2">
                            <button class="mas" id="boton2">+</button>
                        </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="pie-pagina">
    </footer>
    <script src="static/js/script.js"></script>
</body>

</html>
